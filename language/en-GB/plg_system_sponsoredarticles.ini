PLG_SYSTEM_SPONSOREDARTICLES="System - CS Sponsored Articles"
PLG_SYSTEM_SPONSOREDARTICLES_XML_DESCRIPTION="Automatically styles sponsored articles with a custom background color in blog views. Creates a custom field to mark articles as sponsored."
PLG_SYSTEM_SPONSOREDARTICLES_BACKGROUND_COLOR="Sponsored Background Color"
PLG_SYSTEM_SPONSOREDARTICLES_BACKGROUND_COLOR_DESC="Select the background color to use for sponsored articles in blog views. Set a different color for dark mode on the Styling tab."
PLG_SYSTEM_SPONSOREDARTICLES_TEMPLATE_TYPE="Template Type"
PLG_SYSTEM_SPONSOREDARTICLES_TEMPLATE_TYPE_DESC="Select your template type to ensure correct detection of article containers. Use 'Auto' to try all patterns, or select your specific template for better performance."
PLG_SYSTEM_SPONSOREDARTICLES_TEMPLATE_AUTO="Auto-detect (try all patterns)"
PLG_SYSTEM_SPONSOREDARTICLES_TEMPLATE_CUSTOM="Custom CSS Class"
PLG_SYSTEM_SPONSOREDARTICLES_CUSTOM_CLASS="Custom Container Class"
PLG_SYSTEM_SPONSOREDARTICLES_CUSTOM_CLASS_DESC="Enter the CSS class used by your template for blog item containers (e.g., 'my-article-item'). Do not include the dot."

; Styling
PLG_SYSTEM_SPONSOREDARTICLES_FIELDSET_STYLING="Styling"
PLG_SYSTEM_SPONSOREDARTICLES_STYLING_NOTE="Every option on this tab is optional. Leave an option empty and the plugin's look stays exactly as it is today. Only the options you fill in are added to the page."
PLG_SYSTEM_SPONSOREDARTICLES_TEXT_COLOR="Text Color"
PLG_SYSTEM_SPONSOREDARTICLES_TEXT_COLOR_DESC="Text color inside sponsored articles. Leave empty to use the template's text color."
PLG_SYSTEM_SPONSOREDARTICLES_BORDER_COLOR="Border Color"
PLG_SYSTEM_SPONSOREDARTICLES_BORDER_COLOR_DESC="Border color around sponsored articles. Leave empty for no border (unless you set a border width)."
PLG_SYSTEM_SPONSOREDARTICLES_BORDER_WIDTH="Border Width (px)"
PLG_SYSTEM_SPONSOREDARTICLES_BORDER_WIDTH_DESC="Border width in pixels, 0 to 20. Leave empty for no border (unless you set a border color)."
PLG_SYSTEM_SPONSOREDARTICLES_BORDER_RADIUS="Border Radius (px)"
PLG_SYSTEM_SPONSOREDARTICLES_BORDER_RADIUS_DESC="Rounded corners in pixels, 0 to 100. Leave empty to keep the template's corners."
PLG_SYSTEM_SPONSOREDARTICLES_PADDING="Padding (px)"
PLG_SYSTEM_SPONSOREDARTICLES_PADDING_DESC="Space between the border and the content, in pixels, 0 to 100. Leave empty to keep the template's spacing."
PLG_SYSTEM_SPONSOREDARTICLES_DARK_BACKGROUND_COLOR="Dark Mode Background Color"
PLG_SYSTEM_SPONSOREDARTICLES_DARK_BACKGROUND_COLOR_DESC="Background color used instead of the one above when the visitor's device or your template is in dark mode. Leave empty to use the same color in dark mode."
PLG_SYSTEM_SPONSOREDARTICLES_DARK_TEXT_COLOR="Dark Mode Text Color"
PLG_SYSTEM_SPONSOREDARTICLES_DARK_TEXT_COLOR_DESC="Text color used in dark mode. Leave empty to keep the template's text color."
PLG_SYSTEM_SPONSOREDARTICLES_CUSTOM_CSS="Custom CSS"
PLG_SYSTEM_SPONSOREDARTICLES_CUSTOM_CSS_DESC="Your own CSS, added after the plugin's styles so it wins. Sponsored articles carry the class .cs-sponsored-item. For dark mode, wrap rules in @media (prefers-color-scheme: dark) { ... }."

