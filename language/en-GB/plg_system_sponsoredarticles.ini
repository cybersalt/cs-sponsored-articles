PLG_SYSTEM_SPONSOREDARTICLES_SUPPORT_EMAIL="Support Email"
PLG_SYSTEM_SPONSOREDARTICLES_SUPPORT_EMAIL_DESC="Where to send support questions. Shown in any message from this plugin that asks you to contact support."
PLG_SYSTEM_SPONSOREDARTICLES_SUPPORT_URL="Support URL"
PLG_SYSTEM_SPONSOREDARTICLES_SUPPORT_URL_DESC="A support request form or knowledge base page."
PLG_SYSTEM_SPONSOREDARTICLES_SUPPORT_LABEL="Support Label"
